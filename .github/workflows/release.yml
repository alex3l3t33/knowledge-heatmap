name: Release

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Validate release
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: npm run validate
            - name: Attest release assets
              uses: actions/attest@v4
              with:
                  subject-path: |
                      ${{ github.workspace }}/main.js
                      ${{ github.workspace }}/manifest.json
                      ${{ github.workspace }}/styles.css
            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
